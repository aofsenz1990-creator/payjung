<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    ไอคอนบนแท็บเบราว์เซอร์ — ย่อมาจากโลโก้ร้าน (public/logo.png)

    ไม่ได้เอาโลโก้เต็มมาย่อ เพราะโลโก้เป็นตัวอักษรแนวนอนสองบรรทัด
    พอเหลือ 16 พิกเซลจริง ๆ บนแท็บจะกลายเป็นก้อนสีอ่านไม่ออก
    จึงหยิบเฉพาะสิ่งที่จำได้ในขนาดเล็ก: พื้นขาวทรงมน + P ชมพู J ม่วง + ประกาย
  -->
  <rect width="64" height="64" rx="16" fill="#ffffff" />

  <!-- P ของคำว่า Pay — ชมพูเดียวกับโลโก้ -->
  <path
    d="M13 47V17h11.2c6.4 0 10.3 3.7 10.3 9.4 0 5.8-3.9 9.5-10.3 9.5h-4.9V47H13zm6.3-16.4h4.2c2.7 0 4.2-1.5 4.2-4.1 0-2.6-1.5-4.1-4.2-4.1h-4.2v8.2z"
    fill="#f0579a"
  />

  <!-- J ของคำว่า Jung — ม่วงเดียวกับโลโก้ -->
  <path
    d="M45.8 17H52v20.6c0 6.1-3.6 9.9-9.6 9.9-2.3 0-4.3-.5-5.9-1.5l1.9-5.2c1 .6 2.1.9 3.3.9 2.6 0 4.1-1.6 4.1-4.5V17z"
    fill="#8b62d9"
  />

  <!-- ประกายสี่แฉกแบบเดียวกับที่อยู่บนตัว P ในโลโก้ -->
  <path
    d="M23.5 21.5c.9 2.4 1.6 3.1 4 4-2.4.9-3.1 1.6-4 4-.9-2.4-1.6-3.1-4-4 2.4-.9 3.1-1.6 4-4z"
    fill="#ffffff"
  />

  <!-- เส้นสีเหลืองมุมขวาบน มาจากลายในโลโก้ ช่วยให้ไม่จมไปกับไอคอนม่วง ๆ อื่นบนแท็บ -->
  <path
    d="M54 12.5h5M53 17l4.3-2.5M53 8l4.3 2.5"
    stroke="#fbc04b"
    stroke-width="2.4"
    stroke-linecap="round"
    fill="none"
  />
</svg>
